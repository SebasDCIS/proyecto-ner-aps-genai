# Configuración de experimentos. Los nombres de modelos se confirman en la semana 1.

semilla: 42                 # semilla por defecto
semillas: [42, 43, 44]      # cada experimento con modelo entrenable se repite con 3 semillas (media ± DE)
determinista: true
corridas_reproducibilidad: 3
bootstrap_iteraciones: 1000

# Entidades evaluadas en el CWLC (empezamos acotado; ampliar si hay tiempo)
entidades: [Disease, Medication, Abbreviation]

# E1 — Encoders ajustados (Hugging Face)
encoders:
  espanol_clinico: PlanTL-GOB-ES/bsc-bio-ehr-es      # RoBERTa biomédico-clínico (BSC)
  chileno_clinico: plncmm/roberta-clinical-wl-es     # adaptado a derivaciones chilenas
  general: dccuchile/bert-base-spanish-wwm-cased     # BETO
entrenamiento_encoder:
  epocas: 5
  lr: 3.0e-5
  batch: 16
  max_len: 512                # 0 oraciones truncadas a 512; 9 se truncaban a 256 (auditoría)
  dispositivo: mps

# E2 — LLM locales vía Ollama (cuantizados, ~8B)
llm_locales:
  - llama3.1:8b
  - qwen2.5:7b
estrategias_prompt: [zero_shot, few_shot_fijo, few_shot_dinamico]
k_ejemplos: 5
temperatura: 0

# Techo de referencia (API comercial, solo texto público del CWLC)
llm_comercial:              # techo de referencia (corpus público y anonimizado); confirmar nombres y precios vigentes
  - proveedor: openai
    modelo: gpt-6.1-sol       # USD 2 / 10 por millón de tokens (entrada / salida), según lista de oct-2026
    precio_entrada: 2.0
    precio_salida: 10.0
  - proveedor: gemini
    modelo: gemini-3.1-pro    # USD 2 / 12 por millón de tokens
    precio_entrada: 2.0
    precio_salida: 12.0

# E4 — LLM como anotador + gold simulado
destilacion:
  anotador: qwen2.5:7b          # el LLM más confiable en E2 (5% de alucinaciones, 0 JSON inválidos)
  gold_humano: [0, 10, 50, 100] # oraciones con anotación real que se suponen disponibles
  silver_n: 2000                # oraciones de train que anota el LLM (sin mirar su anotación)
  encoder: espanol_clinico      # sin riesgo de contaminación con el test
  epocas: 5
  epocas_solo_gold: 20          # con 10–100 oraciones hacen falta más pasadas

# E3 (opcional) — QLoRA con MLX
qlora:
  modelo_base: mlx-community/Qwen2.5-7B-Instruct-4bit
  rank: 8
  iteraciones: 600
