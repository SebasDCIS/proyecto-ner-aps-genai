# Corpus públicos del proyecto (verificado 2026-10-25, ver docs/verificacion_arranque.md).
corpus:
  cwlc:
    descripcion: >-
      Chilean Waiting List Corpus — 5.000 derivaciones de APS en CoNLL, un archivo por tipo
      de entidad (7 tipos) con splits train/dev/test (8.014 / 890 / 990 oraciones).
      Son los archivos que publicó PLN@CMM con Báez et al. 2022. Licencia del corpus:
      no comercial (Zenodo indica CC BY-NC-SA 4.0).
    fuente: github
    repo: plncmm/acm_health_msen
    rama: master
    base: src/wl_files
    archivos:
      - Abbreviation/Abbreviation_train.conll
      - Abbreviation/Abbreviation_dev.conll
      - Abbreviation/Abbreviation_test.conll
      - Body_Part/Body_Part_train.conll
      - Body_Part/Body_Part_dev.conll
      - Body_Part/Body_Part_test.conll
      - Disease/Disease_train.conll
      - Disease/Disease_dev.conll
      - Disease/Disease_test.conll
      - Family_Member/Family_Member_train.conll
      - Family_Member/Family_Member_dev.conll
      - Family_Member/Family_Member_test.conll
      - Finding/Finding_train.conll
      - Finding/Finding_dev.conll
      - Finding/Finding_test.conll
      - Medication/Medication_train.conll
      - Medication/Medication_dev.conll
      - Medication/Medication_test.conll
      - Procedure/Procedure_train.conll
      - Procedure/Procedure_dev.conll
      - Procedure/Procedure_test.conll
  distemist:
    descripcion: >-
      DisTEMIST v5.1 — 1.000 casos clínicos (España), ENFERMEDAD; train 750 / test 250.
      CC BY 4.0. Contraste de texto "limpio" (F1 ganador del shared task: 0,777).
    fuente: zenodo
    id: 7614764
  ges:
    descripcion: GES classification dataset (CC BY 4.0) — ~941 derivaciones (id, diagnostic, age, ges). Opcional.
    fuente: zenodo
    id: 4737751
# Notas:
# - El CWLC también está en Zenodo (v4: 5591011, standoff + IOB2). Si GitHub falla, usar esa versión.
# - Zenodo 7555181 (v5, 9.000 derivaciones) no trae splits; no usar para comparar con la literatura.
